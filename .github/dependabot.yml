version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "monthly"

  # No "gitsubmodule" entry: it would propose the head of upstream's main, while
  # PROVENANCE.md pins release tags and the provenance check rejects anything else.
