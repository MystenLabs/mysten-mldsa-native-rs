name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/license_check.sh

  # The vendored C is consumed exactly as pinned; this guards the pin itself.
  provenance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the gitlink from the tree, so no submodule checkout is needed.
      - name: submodule pin matches PROVENANCE.md
        run: |
          pin=$(git ls-tree HEAD deps/mldsa-native | awk '{print $3}')
          documented=$(grep -oE '\b[0-9a-f]{40}\b' PROVENANCE.md | head -1)
          echo "gitlink:    $pin"
          echo "documented: $documented"
          test -n "$pin" && test "$pin" = "$documented"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs compiles the C sources from the mldsa-native submodule
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo test --all-features

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo xclippy -D warnings

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  address-sanitizer:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
      CFLAGS: -fsanitize=address -g
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --all-features
