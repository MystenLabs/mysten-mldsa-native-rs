name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/license_check.sh

  # The vendored C is consumed exactly as pinned; this guards the pin itself.
  provenance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Reads the gitlink from the tree, so no submodule checkout is needed.
      - name: submodule pin matches PROVENANCE.md
        run: |
          pin=$(git ls-tree HEAD deps/mldsa-native | awk '{print $3}')
          documented=$(grep -oE '\b[0-9a-f]{40}\b' PROVENANCE.md | head -1)
          echo "gitlink:    $pin"
          echo "documented: $documented"
          test -n "$pin" && test "$pin" = "$documented"

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          # build.rs compiles the C sources from the mldsa-native submodule
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test
      - run: cargo test --all-features

  # The test matrix builds only what its three runners run natively. These legs
  # cross-compile the remaining supported targets. Each one puts the same kernels
  # through a different assembler and object format (GNU as/ELF, Apple as/Mach-O,
  # mingw/COFF), so every supported target at least compiles.
  cross-compile:
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            packages: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            packages: gcc-mingw-w64-x86-64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      # cargo uses the toolchain pinned in rust-toolchain.toml, so the target must be
      # added to that toolchain. The action's `targets:` input would install it into
      # `stable`, which cargo never uses here.
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - run: cargo check --target ${{ matrix.target }} --all-features

  # Everything else in CI builds at opt-level 0. This job tests the optimized build,
  # where optimizer bugs would show up - and where the compiler would emit AVX2 into
  # the C if the containment rule ever broke, so the objdump check runs here too.
  release-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --all-features
      # The C library (libmldsa65.a) must contain no AVX2 at all, i.e. no ymm
      # registers; only the assembly library may. The nonzero check on the assembly
      # proves the scan looked at the right files and the backend was really built.
      - name: AVX2 stays inside the probe-gated assembly
        if: runner.os == 'Linux'
        run: |
          c_lib=$(find target/release -name libmldsa65.a | head -1)
          asm_lib=$(find target/release -name libmldsa_native_asm.a | head -1)
          test -n "$c_lib" && test -n "$asm_lib"
          c_ymm=$(objdump -d "$c_lib" | grep -c '%ymm' || true)
          asm_ymm=$(objdump -d "$asm_lib" | grep -c '%ymm' || true)
          echo "ymm in C objects: $c_ymm; in asm bundle: $asm_ymm"
          test "$c_ymm" -eq 0 && test "$asm_ymm" -gt 0

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo xclippy -D warnings

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps --all-features

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans sources

  address-sanitizer:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
      CFLAGS: -fsanitize=address -g
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - run: cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --all-features
