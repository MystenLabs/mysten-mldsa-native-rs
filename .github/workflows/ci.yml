name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short

permissions:
  contents: read

jobs:
  license-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          persist-credentials: false
      - run: scripts/license_check.sh

  # The vendored C is consumed exactly as pinned; this guards the pin itself: the gitlink,
  # upstream's release tag and the checked-out tree must all be what PROVENANCE.md says.
  provenance-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          persist-credentials: false
          # The script hashes the checked-out mldsa/ directory.
          submodules: true
      - run: scripts/provenance_check.sh

  # ubuntu-24.04-arm is the only runner that executes the aarch64 Linux kernel set: NEON
  # with the scalar Keccak kernels. macOS selects the FEAT_SHA3 Keccak kernels instead.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
      fail-fast: false
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          persist-credentials: false
          # build.rs compiles the C sources from the mldsa-native submodule
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pin@master
        with:
          toolchain: stable
      - run: cargo test --locked
      - run: cargo test --locked --all-features

  # A native build whose CPU probe always answers "no", so every AVX2 wrapper takes its
  # portable fallback branch. No runner reaches those branches otherwise, and a node whose
  # CPU or hypervisor lacks AVX2 depends on them matching the kernels byte for byte.
  # MYSTEN_MLDSA_EXPECT_PROBE fails a test if the probe answers anything else.
  forced-fallback:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings --cfg mysten_mldsa_force_fallback
      MYSTEN_MLDSA_EXPECT_PROBE: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pin@master
        with:
          toolchain: stable
      - run: cargo test --locked --all-features

  # The test matrix builds only what its runners run natively. These legs
  # cross-compile the remaining supported targets. Each one puts the same kernels
  # through a different assembler and object format (GNU as/ELF, Apple as/Mach-O,
  # mingw/COFF), so every supported target at least compiles.
  cross-compile:
    strategy:
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            packages: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-gnu
            os: ubuntu-latest
            packages: gcc-mingw-w64-x86-64
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pin@master
        with:
          toolchain: stable
      # cargo uses the toolchain pinned in rust-toolchain.toml, so the target must be
      # added to that toolchain. The action's `targets:` input would install it into
      # `stable`, which cargo never uses here.
      - run: rustup target add ${{ matrix.target }}
      - if: matrix.packages
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }}
      - run: cargo check --locked --target ${{ matrix.target }} --all-features

  # wasm32-unknown-unknown has no C library, so build.rs compiles the C freestanding
  # and provides the required <string.h> declarations through src/wasm32-freestanding.
  # Linking alone proves little: rustc passes --allow-undefined, which turns a missing C
  # symbol into an import. So the test binaries are run under Node, which first checks
  # that they import nothing.
  wasm:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pin@master
        with:
          toolchain: stable
      - run: rustup target add wasm32-unknown-unknown
      - run: sudo apt-get update && sudo apt-get install -y clang
      - run: cargo test --locked --no-run --target wasm32-unknown-unknown
      # `native` has nothing to offer wasm; this leg keeps its portable-C fallback honest.
      - run: cargo test --locked --no-run --target wasm32-unknown-unknown --all-features
      - run: node scripts/run_wasm_tests.mjs target/wasm32-unknown-unknown/debug/deps/*.wasm

  # Everything else in CI builds at opt-level 0. This job tests the optimized build,
  # where optimizer bugs would show up - and where the compiler would emit AVX2 into
  # the C if the containment rule ever broke, so the objdump check runs here too.
  release-test:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: -D warnings
      # Fails a test if the probe would keep the assembly kernels from running.
      MYSTEN_MLDSA_EXPECT_PROBE: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pin@master
        with:
          toolchain: stable
      - run: cargo test --locked --release --all-features
      # The C library (libmldsa65.a) must contain no AVX2 at all, i.e. no ymm
      # registers; only the assembly library may. The nonzero check on the assembly
      # proves the scan looked at the right files and the backend was really built.
      - name: AVX2 stays inside the probe-gated assembly
        if: runner.os == 'Linux' && runner.arch == 'X64'
        run: |
          c_lib=$(find target/release -name libmldsa65.a | head -1)
          asm_lib=$(find target/release -name libmldsa_native_asm.a | head -1)
          test -n "$c_lib" && test -n "$asm_lib"
          c_ymm=$(objdump -d "$c_lib" | grep -c '%ymm' || true)
          asm_ymm=$(objdump -d "$asm_lib" | grep -c '%ymm' || true)
          echo "ymm in C objects: $c_ymm; in asm bundle: $asm_ymm"
          test "$c_ymm" -eq 0 && test "$asm_ymm" -gt 0

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pin@master
        with:
          toolchain: stable
          components: clippy
      - run: cargo xclippy -D warnings

  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pin@master
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all --check

  docs:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pin@master
        with:
          toolchain: stable
      - run: cargo doc --locked --no-deps --all-features

  cargo-deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # pin@v2.1.1
        with:
          command: check advisories licenses bans sources

  address-sanitizer:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -Zsanitizer=address
      RUSTDOCFLAGS: -Zsanitizer=address
      CFLAGS: -fsanitize=address -g
      ASAN_OPTIONS: detect_leaks=1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # pin@v4.4.0
        with:
          persist-credentials: false
          submodules: true
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # pin@master
        with:
          toolchain: nightly
          components: rust-src
      # Default features first: that run instruments the portable C, which the assembly
      # kernels (invisible to the sanitizer) replace in the second.
      - run: cargo +nightly test --locked -Zbuild-std --target x86_64-unknown-linux-gnu
      - run: cargo +nightly test --locked -Zbuild-std --target x86_64-unknown-linux-gnu --all-features
