[package]
name = "mysten-mldsa-native-rs"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Mysten Labs <build@mystenlabs.com>"]
description = "Minimal safe Rust wrapper around the mldsa-native ML-DSA (FIPS 204) implementation"
readme = "README.md"
repository = "https://github.com/MystenLabs/mysten-mldsa-native-rs"

links = "mldsa65"
# The include list keeps `cargo package` down to the sources the build actually consumes
include = [
    "/src",
    "/build.rs",
    "/README.md",
    "/PROVENANCE.md",
    "/LICENSE",
    "/deps/mldsa-native/mldsa",
    "/deps/mldsa-native/LICENSE",
]

[features]
# Compiles mldsa-native's formally verified assembly backends instead of the portable C:
# NEON on aarch64, AVX2 on x86_64. Outputs are identical. Features that not every CPU
# has stay behind a runtime probe that falls back to portable C: AVX2 on x86_64, and the
# FEAT_SHA3 Keccak kernels on aarch64. The probe is Rust (src/capability.rs, using
# cpufeatures); see build.rs for how AVX2 is kept out of compiler-generated code.
native = ["dep:cpufeatures"]
# Additionally compile the ML-DSA-44 / ML-DSA-87 parameter sets alongside ML-DSA-65
# (upstream's multilevel monobuild) and expose their per-level Rust modules. ML-DSA-65 is
# always on; the levels are not wire-compatible with each other, so picking one is a
# protocol decision. Orthogonal to `native`: the assembly backends cover every compiled
# level from one assembly unit.
mldsa44 = []
mldsa87 = []

[dependencies]
zeroize = "1"
cpufeatures = { version = "0.2", optional = true }

[dev-dependencies]
hex = "0.4.3"
sha2 = "0.10"

[build-dependencies]
cc = "1"
