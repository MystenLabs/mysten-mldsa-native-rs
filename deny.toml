# cargo-deny configuration (run in CI; locally: `cargo deny check`).
# The dependency tree is deliberately tiny (zeroize, optional getrandom, cc),
# so this is much stricter than a typical config: no advisory ignores, no
# license exceptions, unknown sources denied. Widening any of these lists is a
# review-worthy event.

[advisories]
version = 2
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
# No ignores. If an advisory fires, address it or document the ignore here
# with a reason and an expiry, never silently.
ignore = []

[licenses]
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[licenses.private]
ignore = false

[bans]
# A duplicate version in a six-crate tree means something surprising happened.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
